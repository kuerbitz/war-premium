# Refreshes the data every weekday evening and republishes the site.
# Runs entirely on GitHub's servers; nothing runs on anyone's computer.
name: Update data and deploy site

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC Mon-Fri (about 6 pm US Eastern), after Treasury posts the day's yields
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # to commit the refreshed data/data.json
  pages: write      # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the .xls reader (for the New York Fed term-premium file)
        run: pip install xlrd==2.0.1

      - name: Fetch latest open-source data
        run: python scripts/update_data.py

      - name: Commit refreshed data (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
